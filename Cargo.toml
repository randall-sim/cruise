[package]
name = "cc-daemon"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "course-captain"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "signal", "sync", "time", "fs"] }
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
